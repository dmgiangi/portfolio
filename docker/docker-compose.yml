services:
  portfolio:
    image: ghcr.io/dmgiangi/portfolio:latest
    restart: always
    pull_policy: always
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`dmgiangi.dev`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  proxy-net:
    external: true
    name: proxy-net